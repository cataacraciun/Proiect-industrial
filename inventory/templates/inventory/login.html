<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Autentificare | Panou Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Autentificare Manager</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Intră în Cont</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'dashboard' %}" class="text-decoration-none">← Înapoi la Portalul Operatorului</a>
        </div>
    </div>
</body>
</html>
